substitutions:
  name: audiobook-controller
  friendly_name: Audiobook Controller

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.mcu: esp32s3
    board_build.f_cpu: 240000000L

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: latest
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  ap:
    ssid: "Audiobook Controller"
    password: "12345678"

captive_portal:

# Home Assistant API
api:

ota:
  - platform: esphome

logger:
  level: DEBUG

# Microphone for voice interaction
microphone:
  - platform: esp_adf
    id: esp_adf_mic

# Audio I2S for streaming
i2s_audio:
  - id: i2s_shared
    i2s_num: 0

# Microphone stream to Home Assistant for voice processing
voice_assistant:
  microphone: esp_adf_mic
  speaker: i2s_audio
  noise_suppression_level: 2
  auto_gain: 80dB
  volume_multiplier: 1.0

# All Binary Sensors (GPIO Buttons + Home Assistant)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Button 1 (Play/Pause)"
    id: button1
    on_press:
      then:
        - homeassistant.service:
            service: media_player.media_play_pause
            data:
              entity_id: media_player.bedroom
    debounce: 50ms

  - platform: gpio
    pin:
      number: GPIO46
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Button 2 (±30s)"
    id: button2
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - homeassistant.service:
              service: script.audiobook_rewind_30s
              data:
                entity_id: media_player.bedroom
      - min_length: 500ms
        max_length: 5000ms
        then:
          - homeassistant.service:
              service: script.audiobook_forward_30s
              data:
                entity_id: media_player.bedroom

  - platform: homeassistant
    name: "Is Playing"
    entity_id: media_player.bedroom
    attribute: is_playing
    id: is_playing

# Sensors
sensor:
  # Temperature sensor (onboard)
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    id: esp_temp
    
  # Microphone level sensor
  - platform: adc
    pin: GPIO3
    name: "Microphone Level"
    attenuation: 11db
    update_interval: 1s
    filters:
      - multiply: 3.3
      - delta: 0.01

# Home Assistant Text Sensors
text_sensor:
  - platform: homeassistant
    name: "Current Track"
    entity_id: media_player.bedroom
    attribute: media_title
    id: current_track
    
  - platform: homeassistant
    name: "Media Position"
    entity_id: media_player.bedroom
    attribute: media_position_minutes_display
    id: media_position
    
  - platform: homeassistant
    name: "Media Duration"
    entity_id: media_player.bedroom
    attribute: media_duration_minutes_display
    id: media_duration
    
  - platform: homeassistant
    name: "Media Image URL"
    entity_id: media_player.bedroom
    attribute: entity_picture
    id: media_image
    
  - platform: homeassistant
    name: "Media Artist"
    entity_id: media_player.bedroom
    attribute: media_artist
    id: media_artist
    
  - platform: homeassistant
    name: "Current Time"
    entity_id: sensor.time
    id: current_time
    
  - platform: homeassistant
    name: "Temperature"
    entity_id: sensor.bedroom_temperature
    id: temperature
    
  - platform: homeassistant
    name: "Humidity"
    entity_id: sensor.bedroom_humidity
    id: humidity
